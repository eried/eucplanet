# 4 GB, not 2: the three application modules dex in parallel now, and the
# smaller heap ran out during mergeExtDex. CI already builds with 4 GB.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Build the modules side by side, reuse task outputs from earlier builds, and
# skip the configuration phase when none of its inputs changed.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
