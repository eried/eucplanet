name: Play publish

# Puts a signed build in front of testers through Google Play, which is the
# only route that works for the Android Auto car screen: Android Auto refuses
# to list a sideloaded Car App Library app no matter what the rider toggles.
# The "Unknown sources" developer setting covers media, messaging and parked
# apps and explicitly does not cover template apps, so a GitHub APK can never
# appear in the car. See https://developer.android.com/training/cars/testing
#
# Two destinations, neither of them production:
#
#   internal-sharing : Play Internal app sharing. Any signing key, no review,
#                      no version-code bump, link in minutes. Each upload mints
#                      a NEW link, capped at 100 downloads and expiring after
#                      60 days, so this is manual on purpose: an automatic
#                      upload per push would hand testers a fresh link they
#                      have to be told about every time.
#   beta             : the open testing track. Anyone can join from the public
#                      opt-in page, no invitations. Runs automatically on
#                      next-version, which is the branch that carries a real
#                      version bump.
#
# Production is deliberately not reachable from this workflow.
#
# Required secrets (Settings -> Secrets and variables -> Actions), on top of
# the signing four that release-apk.yml already uses:
#   PLAY_SERVICE_ACCOUNT : the whole service-account JSON, pasted as-is.
#                          Play Console -> Setup -> API access -> create a
#                          service account, grant it "Release apps to testing
#                          tracks", download the key.
#
# Note: workflow_dispatch only shows up in the Actions tab when this file is on
# the default branch, so it has to reach main before the manual run exists.

on:
  push:
    branches:
      - next-version
  workflow_dispatch:
    inputs:
      destination:
        description: "Where this build goes"
        type: choice
        options:
          - internal-sharing
          - beta
        default: internal-sharing
      variant:
        description: "Which build to share (internal-sharing only; beta is always release)"
        type: choice
        options:
          - debug
          - release
        default: debug
      announce:
        description: "Post the link to the Telegram releases channel"
        type: boolean
        default: false

permissions:
  contents: read

# Two uploads racing each other would mint two links and confuse whoever is
# waiting for one. Queue instead of cancelling: a half-finished upload is worse
# than a slow one.
concurrency:
  group: play-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve destination
        id: dest
        run: |
          # A push can only ever mean next-version, which goes to beta.
          if [ "${{ github.event_name }}" = "push" ]; then
            dest="beta"
          else
            dest="${{ inputs.destination }}"
          fi
          echo "dest=${dest}" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing ${GITHUB_REF##*/} to ${dest}"

      - name: Verify secrets are configured
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [ -z "$RELEASE_KEYSTORE" ]     && missing+=(RELEASE_KEYSTORE)
          [ -z "$KEYSTORE_PASSWORD" ]    && missing+=(KEYSTORE_PASSWORD)
          [ -z "$KEY_ALIAS" ]            && missing+=(KEY_ALIAS)
          [ -z "$KEY_PASSWORD" ]         && missing+=(KEY_PASSWORD)
          [ -z "$PLAY_SERVICE_ACCOUNT" ] && missing+=(PLAY_SERVICE_ACCOUNT)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Secrets missing: ${missing[*]}"
            echo "::error::Add them in Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          echo "$RELEASE_KEYSTORE" | base64 -d > release.jks
          test -s release.jks || {
            echo "::error::Decoded RELEASE_KEYSTORE is empty."; exit 1; }

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Internal app sharing takes an APK, which is what a tester installs by
      # tapping the link. The tracks take a bundle, which is what Play wants
      # for anything it serves itself.
      #
      # Debug is the default variant here, and that is deliberate. Internal app
      # sharing accepts any signing key, so the build testers get can be the
      # exact one that has been run on a desk, rather than a release build whose
      # R8 pass this feature has never been through. Switch to release when the
      # point of the round IS to rehearse what beta will ship.
      - name: Upload to Internal app sharing
        if: steps.dest.outputs.dest == 'internal-sharing'
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          set -o pipefail
          case "${{ inputs.variant }}" in
            release) task=":app:uploadReleasePrivateApk" ;;
            *)       task=":app:uploadDebugPrivateApk" ;;
          esac
          echo "::notice::Running $task"
          ./gradlew "$task" --no-daemon 2>&1 | tee gradle.log
          grep -q 'BUILD SUCCESSFUL' gradle.log || {
            echo "::error::Gradle did not report BUILD SUCCESSFUL."; exit 1; }

      - name: Publish to beta
        if: steps.dest.outputs.dest == 'beta'
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          set -o pipefail
          ./gradlew :app:publishBundle --track beta --no-daemon 2>&1 | tee gradle.log
          grep -q 'BUILD SUCCESSFUL' gradle.log || {
            echo "::error::Gradle did not report BUILD SUCCESSFUL."; exit 1; }

      # The plugin drops the download URL into a JSON file rather than printing
      # it anywhere a human looks, so dig it out and put it where the person who
      # triggered the run will actually see it.
      - name: Read the sharing link
        id: link
        if: steps.dest.outputs.dest == 'internal-sharing'
        run: |
          file=$(find app/build/outputs/internal-sharing -name '*.json' | head -1)
          if [ -z "$file" ]; then
            echo "::warning::No internal-sharing JSON found; check the Gradle log."
            exit 0
          fi
          url=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('downloadUrl',''))" "$file")
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "## Play publish"
            echo
            echo "- Branch: \`${GITHUB_REF##*/}\`"
            echo "- Destination: **${{ steps.dest.outputs.dest }}**"
            if [ "${{ steps.dest.outputs.dest }}" = "internal-sharing" ]; then
              echo "- Link: ${{ steps.link.outputs.url }}"
              echo
              echo "Testers need Internal app sharing switched on first:"
              echo "Play Store -> Settings -> tap the Play Store version 7 times -> Internal app sharing."
              echo
              echo "The link allows 100 downloads and expires after 60 days."
            else
              echo
              echo "Live on the open testing track once Play finishes processing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Announce on Telegram
        if: inputs.announce && steps.link.outputs.url != ''
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_RELEASES_CHAT_ID }}
          THREAD: ${{ secrets.TELEGRAM_RELEASES_THREAD_ID }}
          URL: ${{ steps.link.outputs.url }}
        run: |
          branch="${GITHUB_REF##*/}"
          text="🚗 <b>${branch}</b> is on Play internal app sharing.%0A%0A"
          text="${text}1. Play Store, Settings, tap the Play Store version 7 times, turn on Internal app sharing%0A"
          text="${text}2. Open ${URL}%0A"
          text="${text}3. Install, then plug into the car%0A%0A"
          text="${text}Uninstall any sideloaded copy first if the install fails."
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "message_thread_id=${THREAD}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${text}" > /dev/null
